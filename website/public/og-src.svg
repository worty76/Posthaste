<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1200" viewBox="0 0 1200 1200">
  <!-- Square canvas for qlmanage; sips center-crops 1200x630 afterwards, so
       the composition sits in the y 285..915 band. -->
  <rect width="1200" height="1200" fill="#fff5f7"/>
  <g font-family="-apple-system, 'Segoe UI', system-ui, sans-serif">
    <rect x="72" y="357" width="8" height="44" rx="4" fill="#ff8fb1"/>
    <text x="98" y="389" font-size="34" font-weight="700" fill="#4a2c3a">Posthaste</text>
    <text x="72" y="520" font-size="50" font-weight="700" fill="#4a2c3a">A thought goes down</text>
    <text x="72" y="595" font-size="50" font-weight="700" fill="#4a2c3a">in two seconds.</text>
    <text x="72" y="671" font-size="22" fill="#806873">Press a shortcut, type, press Enter.</text>
    <text x="72" y="709" font-size="22" fill="#806873">Local-first. No account. No network.</text>
    <text x="72" y="785" font-size="15" fill="#96566c">posthaste-look:1:eyJmb3JtYXQiOiJwb3N0aGFzdGUtbG9</text>
  </g>
  <g>
    <rect x="620" y="375" width="480" height="280" rx="20" fill="#ffffff" stroke="#4a2c3a" stroke-opacity="0.15"/>
    <rect x="648" y="409" width="4" height="16" rx="2" fill="#ff8fb1"/>
    <text x="662" y="422" font-family="-apple-system, 'Segoe UI', system-ui, sans-serif" font-size="17" font-weight="600" fill="#4a2c3a">Quick Note</text>
    <text x="648" y="475" font-size="21" fill="#4a2c3a">give the talk slides to Maya</text>
    <line x1="648" y1="607" x2="1072" y2="607" stroke="#4a2c3a" stroke-opacity="0.12"/>
    <text x="648" y="635" font-family="ui-monospace, monospace" font-size="14" fill="#9d8891">↵ save · esc keeps a draft</text>
  </g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1200" viewBox="0 0 1200 1200">
  <!-- Square canvas for qlmanage; sips center-crops 1200x630 afterwards, so
       the composition sits in the y 285..915 band. Ink look. -->
  <rect width="1200" height="1200" fill="#0f0f0f"/>
  <g font-family="-apple-system, 'Segoe UI', system-ui, sans-serif">
    <image x="72" y="349" width="52" height="52" href="data:image/png;base64,"/>
    <text x="140" y="389" font-size="34" font-weight="700" fill="#f2f2f2">Posthaste</text>
    <text x="72" y="520" font-size="50" font-weight="700" fill="#f2f2f2">A thought goes down</text>
    <text x="72" y="595" font-size="50" font-weight="700" fill="#f2f2f2">in two seconds.</text>
    <text x="72" y="660" font-size="22" fill="#9c9c9c">Press a shortcut, type, press Enter.</text>
    <text x="72" y="698" font-size="22" fill="#9c9c9c">Local-first. No account. No network.</text>
    <text x="72" y="785" font-size="15" fill="#7c7c7c">posthaste-look:1:eyJmb3JtYXQiOiJwb3N0aGFzdGUtbG9</text>
  </g>
  <g>
    <rect x="620" y="375" width="480" height="280" rx="6" fill="#181818" stroke="#f2f2f2" stroke-opacity="0.14"/>
    <rect x="648" y="409" width="4" height="16" rx="2" fill="#ffffff"/>
    <text x="662" y="422" font-family="-apple-system, 'Segoe UI', system-ui, sans-serif" font-size="17" font-weight="600" fill="#f2f2f2">Quick Note</text>
    <text x="648" y="475" font-size="21" fill="#f2f2f2">give the talk slides to Maya</text>
    <line x1="648" y1="607" x2="1072" y2="607" stroke="#f2f2f2" stroke-opacity="0.14"/>
    <text x="648" y="635" font-family="ui-monospace, monospace" font-size="14" fill="#7c7c7c">↵ save · esc keeps a draft</text>
  </g>
</svg>

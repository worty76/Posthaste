[package]
name = "posthaste-platform"
description = "Per-OS code for remembering and re-activating the previously focused application."
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
log = "0.4"

[target.'cfg(target_os = "linux")'.dependencies]
x11rb = "0.14"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "libc", "bitflags", "NSWorkspace", "NSRunningApplication"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSString"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_System_Threading"] }

name: Build and release

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
          - platform: ubuntu-22.04
          - platform: windows-latest
    runs-on: ${{ matrix.platform }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # release notes need the history between tags
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev libssl-dev build-essential
      - name: Install frontend dependencies
        run: npm install
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: v__VERSION__
          releaseName: "Posthaste v__VERSION__"
          releaseBody: "Installers for Posthaste. Linux users: the .AppImage or .deb both work. Platform notes live in docs/platform-notes.md."
          releaseDraft: false
          prerelease: false
          includeUpdaterJson: true
      - name: Fill the release notes from commits
        if: matrix.platform == 'macos-latest' # one writer; the other legs only upload assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION=$(grep -m1 '^version' src-tauri/Cargo.toml | cut -d'"' -f2)
          TAG="v$VERSION"
          PREV=$(git describe --tags --abbrev=0 "$TAG^" 2>/dev/null || true)
          if [ -n "$PREV" ]; then
            LOG=$(git log "$PREV..$TAG" --pretty=format:"- %s (%h)")
            LINK="**Full changelog**: https://github.com/worty76/Posthaste/compare/$PREV...$TAG"
          else
            LOG=""
            LINK=""
          fi
          if [ -z "$LOG" ]; then
            LOG="- Maintenance build. No code changes since $PREV."
          fi
          {
            echo "## What's changed"
            echo
            printf '%s\n' "$LOG"
            echo
            if [ -n "$LINK" ]; then printf '%s\n' "$LINK"; fi
          } > notes.md
          gh release edit "$TAG" --notes-file notes.md

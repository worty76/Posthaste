name: Discord star notification

on:
  watch:
    types: [started]
  workflow_dispatch:

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Send Discord notification
        env:
          ACTOR: ${{ github.actor }}
          REPO: ${{ github.repository }}
          WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          COLOR: "16756401"
        run: |
          jq -n \
            --arg actor "$ACTOR" \
            --arg repo "$REPO" \
            --arg color "$COLOR" \
            --arg avatar "https://posthaste.worty.id.vn/logo-256.png" \
            '{
              username: "Posthaste",
              avatar_url: $avatar,
              embeds: [{
                title: "⭐ New star!",
                description: ("**\($actor)** starred [Posthaste](https://github.com/\($repo)). Thanks!"),
                color: ($color | tonumber)
              }]
            }' | curl -sf -H "Content-Type: application/json" -d @- "$WEBHOOK"
